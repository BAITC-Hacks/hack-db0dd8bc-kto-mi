# Values are read from .env next to this file if it exists (see .env.example).
services:
  qadam:
    build: .
    image: qadam:latest
    container_name: qadam
    ports:
      - "8080:8080"
    environment:
      LLM_MODE: ${LLM_MODE:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-true}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
