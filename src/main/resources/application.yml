spring:
  application:
    name: qadam
  datasource:
    url: jdbc:h2:mem:qadam;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  swagger-ui:
    path: /swagger-ui.html

qadam:
  llm:
    mode: ${LLM_MODE:mock}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      timeout: 60s
      base-url: https://api.openai.com/v1
  pictograms:
    enabled: ${PICTOGRAMS_ENABLED:true}
    locale: ru
    timeout: 5s
